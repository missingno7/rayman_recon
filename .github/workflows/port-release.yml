# Release builds of the native port (port/docs/RELEASE.md): Windows, Linux and Android from a clean checkout - no
# game data, no local tools; SDL 3 and stb_vorbis come from their pinned, hash-checked sources. A tag vX.Y.Z publishes
# a GitHub release with the packages; a manual run (workflow_dispatch) only builds them (artifacts).
name: port release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Build
        run: |
          cmake -S port -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAY_SDL3_FROM_SOURCE=ON
          cmake --build build --target rayman
          build/rayman_sdl3.exe --version
      - name: Package
        run: python port/tools/package.py windows build out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # Ubuntu 22.04 (glibc 2.35) keeps the binary runnable on older distributions; GCC 12 for -ftrivial-auto-var-init.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (SDL's X11, Wayland, audio and input headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 ninja-build python3 libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libpulse-dev libasound2-dev libdbus-1-dev \
            libudev-dev libdecor-0-dev
      - name: Build
        run: |
          cmake -S port -B build -G Ninja -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRAY_SDL3_FROM_SOURCE=ON
          cmake --build build --target rayman
          build/rayman_sdl3 --version
      - name: Package
        run: python3 port/tools/package.py linux build out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  android:
    runs-on: ubuntu-22.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" \
            "platforms;android-36" > /dev/null
      - name: SDL tarball (SDL's Java glue and native source, hash-checked)
        run: |
          version=$(sed -n 's/.*RAY_SDL3_VERSION "\([^"]*\)".*/\1/p' port/CMakeLists.txt)
          sha=$(sed -n 's/.*RAY_SDL3_SHA256 "\([0-9a-f]*\)".*/\1/p' port/CMakeLists.txt)
          curl -sSL -o "$RUNNER_TEMP/SDL3.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-$version/SDL3-$version.tar.gz"
          echo "$sha  $RUNNER_TEMP/SDL3.tar.gz" | sha256sum -c -
      - name: Release key
        id: key
        env:
          KEYSTORE: ${{ secrets.RAYMAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RAYMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release key: the APK is signed with the debug key and not published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: port/android
        env:
          RAYMAN_KEYSTORE_PASSWORD: ${{ secrets.RAYMAN_KEYSTORE_PASSWORD }}
          RAYMAN_KEY_ALIAS: ${{ secrets.RAYMAN_KEY_ALIAS }}
          RAYMAN_KEY_PASSWORD: ${{ secrets.RAYMAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PsdlTarball="$RUNNER_TEMP/SDL3.tar.gz" -Ppython=python3
      - name: Package
        run: python3 port/tools/package.py android port/android/app/build/outputs/apk/release/app-release.apk out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          files=$(ls dist/windows/* dist/linux/*)
          if [ "$SIGNED" = "true" ]; then files="$files $(ls dist/android/*)"; fi
          notes="port/docs/release-notes/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" $files --title "Rayman native port ${GITHUB_REF_NAME}" \
            --notes-file "$notes"
